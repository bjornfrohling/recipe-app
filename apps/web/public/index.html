<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recipe App</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Recipe App</h1>
      <p>Create recipes, browse them, and add ratings and written reviews.</p>
    </header>

    <main>
      <section class="card">
        <h2>Add a Recipe</h2>
        <form id="recipe-form">
          <label>
            Title
            <input id="title" name="title" required maxlength="120" />
          </label>

          <label>
            Description
            <textarea
              id="description"
              name="description"
              required
              maxlength="400"
            ></textarea>
          </label>

          <label>
            Ingredients
            <textarea
              id="ingredients"
              name="ingredients"
              required
              placeholder="One ingredient per line"
            ></textarea>
          </label>

          <label>
            Instructions
            <textarea
              id="instructions"
              name="instructions"
              required
              maxlength="2000"
            ></textarea>
          </label>

          <button type="submit">Save recipe</button>
        </form>
      </section>

      <section class="card">
        <h2>Recipes</h2>
        <div id="recipes-empty" class="muted">No recipes yet.</div>
        <div id="recipes" class="recipe-list"></div>
      </section>

      <section class="card">
        <h2>Recipe Details</h2>
        <div id="selected-recipe" class="muted">
          Select a recipe to view its details and reviews.
        </div>

        <div id="recipe-details" class="hidden">
          <h3 id="detail-title"></h3>
          <p id="detail-description"></p>

          <h4>Ingredients</h4>
          <ul id="detail-ingredients"></ul>

          <h4>Instructions</h4>
          <p id="detail-instructions"></p>

          <h4>Reviews</h4>
          <div id="review-summary" class="muted"></div>
          <div id="reviews-empty" class="muted">No reviews yet.</div>
          <div id="reviews"></div>

          <h4>Add a Review</h4>
          <form id="review-form">
            <input type="hidden" id="review-recipe-id" />

            <label>
              Your name
              <input id="reviewerName" name="reviewerName" required />
            </label>

            <label>
              Rating (1-5)
              <input
                id="rating"
                name="rating"
                required
                type="number"
                min="1"
                max="5"
              />
            </label>

            <label>
              Comment
              <textarea id="comment" name="comment" required maxlength="600"></textarea>
            </label>

            <button type="submit">Save review</button>
          </form>
        </div>
      </section>
    </main>

    <div id="status" role="status" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
