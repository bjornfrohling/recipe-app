services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recipeapp
      POSTGRES_USER: recipeapp
      POSTGRES_PASSWORD: recipeapp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipeapp -d recipeapp"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  recipe-service:
    build: ./services/recipe-service
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: recipeapp
      DB_USER: recipeapp
      DB_PASSWORD: recipeapp
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"

  review-service:
    build: ./services/review-service
    environment:
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: recipeapp
      DB_USER: recipeapp
      DB_PASSWORD: recipeapp
      RECIPE_SERVICE_URL: http://recipe-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      recipe-service:
        condition: service_started
    ports:
      - "3002:3002"

  web:
    build: ./apps/web
    environment:
      PORT: 3000
      RECIPE_SERVICE_URL: http://recipe-service:3001
      REVIEW_SERVICE_URL: http://review-service:3002
    depends_on:
      recipe-service:
        condition: service_started
      review-service:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  postgres-data:
